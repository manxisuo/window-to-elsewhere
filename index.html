<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界尽头的窗户 · Window to Elsewhere</title><style>
*{box-sizing:border-box}body{margin:0;background:#101825;color:#f6eee4;font-family:system-ui,"Noto Serif SC",serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;z-index:3;left:5vw;right:5vw;pointer-events:none}.top{top:5vh}.bottom{bottom:5vh;display:flex;align-items:end;justify-content:space-between;gap:16px}.eyebrow{font:10px system-ui;letter-spacing:.35em;color:#ffffffa0}h1{font-size:clamp(22px,3vw,40px);font-weight:400;letter-spacing:.15em;margin:12px 0}h2{font-size:clamp(26px,4vw,52px);font-weight:400;margin:8px 0}p{font-size:13px;color:#ffffffbd;line-height:1.8;max-width:360px}.buttons{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap}.buttons button,.panel button{border:1px solid #ffffff50;border-radius:30px;background:#172234a8;backdrop-filter:blur(12px);color:#fff;padding:11px 15px;cursor:pointer}.buttons button:hover,.panel button:hover{background:#ffffff35}.panel{position:fixed;z-index:4;right:5vw;bottom:120px;padding:20px;background:#142030d9;border:1px solid #ffffff30;border-radius:18px;backdrop-filter:blur(18px);width:min(320px,90vw)}.panel[hidden],.hidden{display:none!important}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{border-radius:12px}.choices button.active{background:#d4b59a70}input{width:100%;accent-color:#edc8a0;margin-top:15px}.grain{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,#05081285);z-index:2}.hint{font-size:11px;color:#ffffff8a;margin-top:12px}@media(max-width:720px){.bottom{flex-direction:column;align-items:start}.panel{bottom:180px}.buttons button{padding:9px 12px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><canvas id="view" aria-label="动态窗外风景"></canvas><div class="grain"></div><div id="interface"><div class="ui top"><div class="eyebrow">A LITTLE PLACE OUTSIDE OF TIME</div><h1>世界尽头的窗户</h1></div><div class="ui bottom"><div><div class="eyebrow" id="number">01 / 04</div><h2 id="title">潮汐与落日</h2><p id="description">世界很大，而此刻只需要一扇窗。<br>听风经过，等最后一束光落进海里。</p><div class="hint">点击窗外留下涟漪 · ESC 退出沉浸</div></div><div class="buttons"><button id="random">✧ 随机漫游</button><button id="settings">◷ 场景与时间</button><button id="tour">◌ 自动漫游</button><button id="capture">↧ 留住此刻</button><button id="focus">⛶ 沉浸</button></div></div><div class="panel" id="panel" hidden><div class="eyebrow" style="margin-bottom:15px">CHOOSE YOUR ELSEWHERE</div><div class="choices" id="choices"></div><p>一天中的时间 <span id="clock">18:00</span></p><input id="hour" type="range" min="0" max="24" step=".25" value="18"></div></div>
<script>
const $=id=>document.getElementById(id),c=$('view'),g=c.getContext('2d'),names=['潮汐与落日','雨夜霓虹','雪山来信','星河漫游'],desc=['世界很大，而此刻只需要一扇窗。<br>听风经过，等最后一束光落进海里。','城市在雨里慢慢模糊。<br>每一盏灯，都有一个尚未讲完的故事。','群山在晨光里苏醒。<br>雪落下的时候，时间也变得轻盈。','在银河下，所有遥远都变得温柔。<br>今夜，允许自己做一个漫长的梦。'];
let W,H,D=1,scene=0,hour=18,mouse={x:0,y:0},tour=null,ripples=[],last=0;
const rnd=n=>{let v=Math.sin(n*127.1+78.233)*43758.5453;return v-Math.floor(v)};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function fill(color,x=0,y=0,w=W,h=H){g.fillStyle=color;g.fillRect(x,y,w,h)}
function gradient(y0,y1,colors){let v=g.createLinearGradient(0,y0,0,y1);colors.forEach((x,i)=>v.addColorStop(i/(colors.length-1),x));return v}
function circle(x,y,r,color){g.beginPath();g.arc(x,y,Math.max(.1,r),0,Math.PI*2);g.fillStyle=color;g.fill()}
function stroke(x,y,xx,yy,color,w=1){g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.strokeStyle=color;g.lineWidth=w;g.stroke()}
function mountain(base,amp,color,seed){g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+10;x+=7){let z=x/W;g.lineTo(x,base-(Math.sin(z*8+seed)*.5+Math.sin(z*23+seed*2)*.22+Math.sin(z*51+seed)*.1)*amp)}g.lineTo(W,H);g.closePath();g.fillStyle=color;g.fill()}
function atmosphere(t){let palettes=[['#17263f','#dc8d79','#f4c59d'],['#0c1932','#425775','#bb8095'],['#668da9','#c1dbe5','#ffe0b6'],['#071024','#1c3154','#505c85']];let p=palettes[scene];fill(gradient(0,H,p));for(let i=0;i<8;i++){let x=(rnd(i*3)*1.5*W+t*.006*(i%2?1:-1))%(W*1.5)-W*.2,y=H*(.12+rnd(i+5)*.4);g.save();g.filter='blur(22px)';g.beginPath();g.ellipse(x,y,W*(.06+rnd(i+3)*.08),H*.023,0,0,7);g.fillStyle=scene===3?'#d9d3ff15':'#fff3df24';g.fill();g.restore()}}
function coast(t){let sunY=H*(.62-(hour-12)*.043),sunX=W*.7;let glow=g.createRadialGradient(sunX,sunY,4,sunX,sunY,W*.35);glow.addColorStop(0,'#ffe5ac99');glow.addColorStop(1,'#f6a87800');fill(glow);circle(sunX,sunY,Math.max(18,W*.026),'#ffe1af');mountain(H*.64,H*.12,'#526c81',1);mountain(H*.69,H*.075,'#2e4d66',3);fill(gradient(H*.65,H,['#577c89','#304e65','#142b40']),0,H*.65,W,H*.35);for(let i=0;i<130;i++){let x=rnd(i*7)*W,y=H*(.66+rnd(i*4)*.34),len=(y/H)*rnd(i+5)*24;stroke(x+Math.sin(t*.0008+i)*5,y,x+len,y,'#ffe4ba55',.7)}for(let j=0;j<11;j++){let y=H*(.68+j*.028);g.beginPath();for(let x=0;x<=W;x+=8){let yy=y+Math.sin(x*.018+t*.001+j)*3;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.strokeStyle='#e5f0ef28';g.stroke()}}
function city(t){fill('#18263d',0,H*.72,W,H*.28);for(let i=0;i<55;i++){let x=i*W/54,w=W/54*(.8+rnd(i+7)),height=H*(.1+rnd(i*8)*.42),y=H*.76-height;fill(i%2?'#15243b':'#20314b',x,y,w,height);for(let r=0;r<height/18;r++)for(let k=0;k<w/11;k++)if(rnd(i*133+r*11+k*5)>.5)fill(['#e8d1a688','#a4cbe488','#e39eae88'][i%3],x+4+k*11,y+7+r*18,3,5)}for(let i=0;i<190;i++){let x=rnd(i*13)*W,y=(rnd(i*7)*H+t*(.12+rnd(i)*.3))%(H+30)-15;stroke(x,y,x-6,y+17,'#d8e6ff50')}}
function alpine(t){for(let i=0;i<4;i++)mountain(H*(.63+i*.065),H*(.32-i*.04),['#e8e9e4','#b7ccd6','#7295aa','#355c72'][i],i+2);for(let i=0;i<100;i++){let x=rnd(i*9)*W,y=(rnd(i*4)*H+t*.025*(1+rnd(i)))%H;circle(x+Math.sin(t*.0007+i)*15,y,1+rnd(i+5)*2,'#ffffffa5')}}
function night(t){for(let i=0;i<200;i++){let x=rnd(i*11)*W,y=rnd(i*17)*H*.7;circle(x,y,.4+rnd(i+3)*1.5,'rgba(229,237,255,'+(.35+.6*(.5+.5*Math.sin(t*.002+i)))+')')}g.save();g.translate(W*.47,H*.25);g.rotate(-.38);fill(gradient(-H*.2,H*.4,['#a6b3e000','#a9a3df27','#a6b3e000']),-W*.12,-H*.3,W*.24,H*.8);g.restore();mountain(H*.73,H*.14,'#293d5d',2);mountain(H*.8,H*.09,'#14273e',5);fill(gradient(H*.75,H,['#263955','#0a192b']),0,H*.75,W,H*.25)}
function frame(){let m=W<700?W*.06:W*.12,top=H*.12,bottom=H*.88;fill('#10151e',0,0,m,H);fill('#10151e',W-m,0,m,H);fill('#10151e',0,0,W,top);fill('#10151e',0,bottom,W,H-bottom);fill('#29323a',m-19,top-12,19,bottom-top+24);fill('#29323a',W-m,top-12,19,bottom-top+24);fill('#273039',m-19,top-16,W-2*m+38,19);fill('#18222b',m-19,bottom-7,W-2*m+38,24);fill('#222b34',W/2-7,top,14,bottom-top);fill('#ffffff14',W/2-4,top,2,bottom-top);fill('#222b34',m,H*.53,W-2*m,10);fill('#ffffff18',m,H*.53,W-2*m,2);fill(gradient(bottom,H,['#49403a','#15171c']),0,bottom+17,W,H-bottom);fill('#8e7257',m-25,bottom+12,W-2*m+50,10)}
function plant(){let x=W*.17,y=H*.94;fill('#8f6c50',x-19,y-23,38,34);fill('#b38d69',x-23,y-25,46,7);for(let i=0;i<9;i++){let a=i*2.4;g.beginPath();g.ellipse(x+Math.sin(a)*19,y-55-Math.cos(a)*20,10,23,a*.2,0,7);g.fillStyle=i%2?'#355c4d':'#294c40';g.fill()}}
function draw(t){last=t;g.clearRect(0,0,W,H);g.save();g.translate(mouse.x*3,mouse.y*2);atmosphere(t);[coast,city,alpine,night][scene](t);g.restore();frame();plant();ripples=ripples.filter(r=>t-r.t<900);ripples.forEach(r=>{let p=(t-r.t)/900;g.beginPath();g.arc(r.x,r.y,12+p*65,0,7);g.strokeStyle='rgba(255,255,255,'+(.35*(1-p))+')';g.stroke()});requestAnimationFrame(draw)}requestAnimationFrame(draw);
function setScene(n){scene=(n+4)%4;$('number').textContent=String(scene+1).padStart(2,'0')+' / 04';$('title').textContent=names[scene];$('description').innerHTML=desc[scene];document.querySelectorAll('.choices button').forEach((b,i)=>b.classList.toggle('active',i===scene));history.replaceState(null,'',location.pathname+'?scene='+scene+'&hour='+hour)}
names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>setScene(i);$('choices').appendChild(b)});
$('random').onclick=()=>setScene((scene+1+Math.floor(Math.random()*3))%4);$('settings').onclick=()=>$('panel').hidden=!$('panel').hidden;
$('tour').onclick=()=>{if(tour){clearInterval(tour);tour=null;$('tour').textContent='◌ 自动漫游'}else{tour=setInterval(()=>setScene(scene+1),25000);$('tour').textContent='Ⅱ 暂停漫游'}};
$('capture').onclick=()=>{let a=document.createElement('a');a.download='window-to-elsewhere.png';a.href=c.toDataURL('image/png');a.click()};
$('focus').onclick=()=>$('interface').classList.add('hidden');
addEventListener('keydown',e=>{if(e.key==='Escape')$('interface').classList.remove('hidden');if(e.key==='ArrowRight')setScene(scene+1);if(e.key==='ArrowLeft')setScene(scene-1)});
c.addEventListener('pointermove',e=>{mouse.x=e.clientX/W-.5;mouse.y=e.clientY/H-.5});c.addEventListener('pointerdown',e=>{if($('interface').classList.contains('hidden')){$('interface').classList.remove('hidden');return}ripples.push({x:e.clientX,y:e.clientY,t:performance.now()})});
$('hour').oninput=e=>{hour=+e.target.value;$('clock').textContent=String(Math.floor(hour)%24).padStart(2,'0')+':'+String(Math.round(hour%1*60)).padStart(2,'0');history.replaceState(null,'',location.pathname+'?scene='+scene+'&hour='+hour)};
let q=new URLSearchParams(location.search),s=Number(q.get('scene')),h=Number(q.get('hour'));if(q.has('hour')&&Number.isFinite(h)&&h>=0&&h<=24){hour=h;$('hour').value=h;$('clock').textContent=String(Math.floor(h)%24).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0')}setScene(q.has('scene')&&Number.isInteger(s)&&s>=0&&s<4?s:0);
</script></html>
